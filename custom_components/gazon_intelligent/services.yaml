set_mode:
  description: "Choisit un mode (Sursemis, Traitement, etc.) et met à jour les calculs du gazon ciblé."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    mode:
      required: true
      example: Sursemis
      selector:
        select:
          translation_key: gazon_mode
          options:
            - Normal
            - Sursemis
            - Traitement
            - Fertilisation
            - Biostimulant
            - Agent Mouillant
            - Scarification
            - Hivernage

set_date_action:
  description: "Indique la date réelle de l'action pour le gazon ciblé. Formats acceptés: JJ/MM/AAAA ou YYYY-MM-DD. Si vide, la date du jour est utilisée."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    date_action:
      required: false
      example: "15/05/2026"
      selector:
        text: {}

reset_mode:
  description: "Réinitialise le gazon ciblé en mode Normal."
  target:
    entity:
      integration: gazon_intelligent

start_manual_irrigation:
  description: "Déclenche un arrosage manuel et indique l'eau à apporter en mm sur le gazon ciblé."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    objectif_mm:
      required: true
      example: 3
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: mm

start_auto_irrigation:
  description: "Lance chaque zone à la suite avec le débit configuré. Si l'eau à apporter est vide, l'intégration utilise la valeur calculée automatiquement."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    objectif_mm:
      required: false
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: mm
    plan_arrosage_entity:
      required: false
      selector:
        text: {}
    source:
      required: false
      selector:
        text: {}

start_application_irrigation:
  description: "Déclenche un arrosage contrôlé post-application sans piloter les zones directement."
  target:
    entity:
      integration: gazon_intelligent

stop_irrigation:
  description: "Arrête immédiatement l'arrosage en cours : ferme la vanne ouverte, enregistre l'eau déjà appliquée (y compris la zone interrompue, au prorata) et libère le cycle. Sans effet si aucun arrosage n'est en cours."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    raison:
      required: false
      selector:
        text: {}

declare_intervention:
  description: "Déclare une intervention réelle. Les réglages du produit se configurent dans \"Enregistrer un produit\" ; ici, il suffit de choisir le produit déjà enregistré, la date, la zone et une note si besoin. Si plusieurs produits existent et qu'aucun produit explicite n'est fourni, l'intégration peut utiliser la sélection courante de l'UI ou renvoyer une erreur claire."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    intervention:
      required: true
      selector:
        select:
          translation_key: gazon_intervention
          options:
            - Sursemis
            - Traitement
            - Fertilisation
            - Biostimulant
            - Agent Mouillant
            - Scarification
            - Hivernage
    date_action:
      required: false
      example: "15/05/2026"
      selector:
        text: {}
    produit_id:
      required: false
      selector:
        text: {}
    produit:
      required: false
      selector:
        text: {}
    zone:
      required: false
      selector:
        text: {}
    note:
      required: false
      selector:
        text: {}

remove_last_application:
  description: "Supprime la dernière application enregistrée dans l'historique local."
  target:
    entity:
      integration: gazon_intelligent

register_product:
  description: "Ajoute ou met à jour un produit personnalisé dans la base locale. La catégorie se choisit dans une liste, le dosage peut être saisi au m², les mois d'application peuvent être précisés et des seuils de température optionnels peuvent affiner la recommandation."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    product_id:
      required: true
      selector:
        text: {}
    nom:
      required: true
      selector:
        text: {}
    type:
      required: true
      selector:
        select:
          translation_key: gazon_product_category
          options:
            - Traitement
            - Fertilisation
            - Biostimulant
            - Agent Mouillant
            - Scarification
            - Hivernage
    dose_conseillee:
      required: false
      example: "1.2 ml / m²"
      selector:
        text: {}
    usage_mode:
      required: false
      selector:
        select:
          options:
            - preventif
            - curatif
            - entretien
            - rattrapage
    max_applications_per_year:
      required: false
      selector:
        number:
          min: 0
          max: 3650
          step: 1
    reapplication_after_days:
      required: false
      selector:
        number:
          min: 0
          max: 3650
          step: 1
          unit_of_measurement: j
    delai_avant_tonte_jours:
      required: false
      selector:
        number:
          min: 0
          max: 3650
          step: 1
          unit_of_measurement: j
    phase_compatible:
      required: false
      selector:
        select:
          translation_key: gazon_phase_compatible
          multiple: true
          options:
            - Sursemis
            - Croissance
            - Entretien
    application_months:
      required: false
      selector:
        text: {}
    application_type:
      required: false
      selector:
        select:
          options:
            - sol
            - foliaire
    application_requires_watering_after:
      required: false
      selector:
        boolean: {}
    application_post_watering_mm:
      required: false
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: mm
    application_irrigation_block_hours:
      required: false
      selector:
        number:
          min: 0
          max: 72
          step: 1
          unit_of_measurement: h
    application_irrigation_delay_minutes:
      required: false
      selector:
        number:
          min: 0
          max: 1440
          step: 1
          unit_of_measurement: min
    application_irrigation_mode:
      required: false
      selector:
        select:
          options:
            - auto
            - manuel
            - suggestion
    application_label_notes:
      required: false
      selector:
        text: {}
    note:
      required: false
      selector:
        text: {}
    temperature_min:
      required: false
      example: 8
      selector:
        number:
          min: -30
          max: 60
          step: 0.5
          unit_of_measurement: "°C"
    temperature_max:
      required: false
      example: 28
      selector:
        number:
          min: -30
          max: 60
          step: 0.5
          unit_of_measurement: "°C"

remove_product:
  description: "Retire un produit de la base locale."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    product_id:
      required: true
      selector:
        text: {}

declare_mowing:
  description: "Enregistre une tonte dans l'historique du gazon ciblé. Choisir l'entité de tonte autorisée du gazon concerné."
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: gazon_intelligent
          domain: binary_sensor
    date_action:
      required: false
      example: "15/05/2026"
      selector:
        text: {}
    hauteur_coupe_mm:
      required: false
      example: 50
      selector:
        number:
          min: 10
          max: 120
          unit_of_measurement: mm

declare_watering:
  description: "Enregistre un arrosage dans l'historique du gazon ciblé."
  target:
    entity:
      integration: gazon_intelligent
  fields:
    date_action:
      required: false
      example: "15/05/2026"
      selector:
        text: {}
    objectif_mm:
      required: false
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: mm

recalibrate_reserve:
  description: >-
    Recale la réserve hydrique du sol du gazon ciblé à une valeur connue (calibration
    manuelle). La valeur fixée est figée pour le reste de la journée (la pluie, l'arrosage
    et l'évapotranspiration du jour ne sont plus comptés ce jour-là) ; l'évolution normale
    reprend dès le lendemain. À appeler de préférence quand aucune pluie/arrosage important
    n'est attendu dans la journée (ex. le soir).
  target:
    entity:
      integration: gazon_intelligent
  fields:
    reserve_mm:
      required: true
      example: 8
      selector:
        number:
          min: 0
          max: 100
          step: 0.1
          unit_of_measurement: mm
    figer_la_journee:
      required: false
      default: true
      description: >-
        Activé (défaut) : la valeur est figée jusqu'à minuit — c'est ce qu'il faut quand tu
        viens de sonder ton sol, sinon le recalcul du cycle suivant écraserait ta mesure.
        Désactivé : la valeur est posée mais la journée continue normalement (évapotranspiration
        débitée, pluie et arrosage crédités, jauge qui redescend). À utiliser pour corriger une
        comptabilité faussée en cours de journée sans perdre le reste de celle-ci.
      selector:
        boolean:
