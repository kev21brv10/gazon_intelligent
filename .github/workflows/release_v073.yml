name: Release v0.7.3
'on':
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write release body
        run: |
          cat > /tmp/release_body.md << 'RELEASE_EOF'
          ## 🌿 v0.7.3 — ET0 Penman-Monteith, latitude HA, arrondi corrigé
          
          ### ✨ Améliorations
          
          #### 📐 ET0 Penman-Monteith FAO-56
          Le calcul de l'évapotranspiration de référence a été entièrement revu.
          - Ancienne formule : ET0 empirique (sous-estime de 2-3x en été)
          - Nouvelle formule : Penman-Monteith FAO-56 complète
            - Déficit de pression de vapeur (VPD) — moteur principal de l'évaporation
            - Rayonnement net calculé depuis couverture nuageuse ou indice UV
          
          #### 🌍 Latitude HA utilisée automatiquement
          Le coordinateur injecte hass.config.latitude dans le profil météo.
          - Même 15 °C — 3,6 mm/j en juillet vs 1,4 mm/j en janvier à 48°N
          
          #### 🔢 Arrondi symétrique corrigé
          _round_half_up_1 produisait des résultats asymétriques pour les valeurs négatives,
          causant des incohérences précédent + delta != réserve dans le bilan hydrique.
          
          #### 🧹 Attributs nettoyés
          Suppression des attributs redondants du capteur reserve_utile_actuelle.
          
          ### 🧪 Tests
          433 tests — 433 passent
          RELEASE_EOF
          sed -i 's/^          //' /tmp/release_body.md

      - name: Create GitHub Release v0.7.3
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/release_body.md', 'utf8');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v0.7.3',
              name: 'v0.7.3',
              body: body,
              target_commitish: 'e20faea44d8c06ea1330e3a8353651b9ccf804e5',
              draft: false,
              prerelease: false,
            });
            core.info('Release v0.7.3 created successfully');
