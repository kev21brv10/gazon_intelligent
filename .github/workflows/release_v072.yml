name: Release v0.7.2

'on':
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write release body
        run: |
          cat > /tmp/release_body.md << 'RELEASE_EOF'
          ## Politiques d'arrosage, état partagé & contrat public

          ### 💧 Politiques d'arrosage par mode

          - Introduction de `watering_policy.py` : référentiel central figé des politiques métier par mode
          - Chaque mode dispose d'une politique propre avec :
            - catégorie (`weekly`, `daily_event`, `event`, `conditional_event`, `blocked_mode`)
            - comportement d'override (`base`, `replace_all`, `targeted_override`, `block_all`, `block_watering`)
            - comportement de blocage (`none`, `block_other_modes`, `weather_guard`, `condition_guard`, etc.)
            - bandes de dose saisonnières (`baseline`, `spring`, `summer`, `heatwave`, `autumn`, `sursemis`, `hivernage`)
          - Resolver central pour arbitrer la politique active selon le mode courant
          - Aucun changement du moteur de décision existant

          ### 🧩 État partagé multi-instance

          - Introduction de `shared_state.py` : couche de résolution de configuration partagée
          - Priorité de résolution : local > partagé > data > défaut
          - Persistance via `Store` Home Assistant
          - Clés météo communes isolées dans `SHARED_WEATHER_CONFIG_KEYS`
          - Base propre pour la configuration multi-pelouse

          ### 🤖 Adaptateur tondeuse étendu

          - Cinq nouveaux états machine reconnus et traduits :
            - `mower_starting` -> Tondeuse en démarrage
            - `mower_zoning` -> Tondeuse en changement de zone
            - `mower_searching_zone` -> Tondeuse en recherche de zone
            - `mower_rain_delayed` -> Pause pluie active
            - `mower_escaped_digital_fence` -> Tondeuse sortie du périmètre
          - Meilleure couverture des états Husqvarna Automower

          ### 🔧 Corrections et conformité

          - Ajout de `CONFIG_SCHEMA` pour conformité complète Hassfest
          - Services HA : support de `device_id` et `area_id` comme cibles en plus de `entity_id`
          - Format de date `YYYY-MM-DD` accepté en plus de `JJ/MM/AAAA`
          - Corrections sur les binary sensors d'irrigation (nouveau blocage actif)
          - Alignement des modèles de décision, tonte, arrosage et risque

          ### 📘 Documentation

          - Ajout de `docs/public-attribute-contract.md` : contrat public figé des attributs exposés
          - Distinction claire entre attributs canoniques, alias legacy et dépréciations futures
          - Couverture complète des entités publiques principales
          - Référencé depuis le README

          ### 🧪 Qualité

          - Nouveau fichier `tests/test_dose_policy.py` : couverture des politiques d'arrosage
          - `test_entity_result_chain.py` largement étendu (+304 lignes)
          - `test_watering_session_monitoring.py` renforcé (+172 lignes)
          - `test_diagnostics.py` complété
          - `test_mower_coordination.py` et `test_gazon_brain.py` étendus

          ### ⚠️ Important

          - Aucun changement de logique métier runtime
          - Aucune migration nécessaire
          - Aucune entité supprimée ou renommée
          - `watering_policy.py` et `shared_state.py` sont des fondations pour les évolutions futures
          RELEASE_EOF
          sed -i 's/^          //' /tmp/release_body.md

      - name: Create GitHub Release v0.7.2
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/release_body.md', 'utf8');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v0.7.2',
              name: 'v0.7.2',
              body: body,
              target_commitish: '70112aedd7dec7af477247056c101b39808cc0dc',
              draft: false,
              prerelease: false,
            });
            core.info('Release v0.7.2 created successfully');
