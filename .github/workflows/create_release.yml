name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.7.3)'
        required: true
        default: 'v0.7.3'
      target_sha:
        description: 'Target commit SHA'
        required: true
      body:
        description: 'Release body (markdown)'
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BODY: ${{ inputs.body }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ inputs.target_sha }}" \
            --title "${{ inputs.tag }}" \
            --notes "$RELEASE_BODY"
