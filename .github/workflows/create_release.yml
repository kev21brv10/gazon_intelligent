name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.7.3)'
        required: true
        default: 'v0.7.3'
      target_sha:
        description: 'Target commit SHA'
        required: true
      body:
        description: 'Release body (markdown)'
        required: true

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Write release body to file
        env:
          RELEASE_BODY: ${{ inputs.body }}
        run: printf '%s' "$RELEASE_BODY" > /tmp/release_body.md

      - name: Create Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/release_body.md', 'utf8');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ inputs.tag }}',
              name: '${{ inputs.tag }}',
              body: body,
              target_commitish: '${{ inputs.target_sha }}',
              draft: false,
              prerelease: false,
            });
            console.log('Release created: ${{ inputs.tag }}');
