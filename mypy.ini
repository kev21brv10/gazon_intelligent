[mypy]
python_version = 3.13
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
# Périmètre : les modules qui passent sans erreur, mesurés un par un puis ensemble.
# Étendu le 29/07/2026 de 23 à 39 fichiers — la TOTALITÉ de l'intégration — les 10 ajoutés (marqués ci-dessous) ont été nettoyés
# à cette occasion, sans le moindre changement de comportement : les erreurs étaient des faux
# positifs (gardes que le vérificateur ne sait pas affiner, replis try/except volontaires,
# invariance de `dict` là où `Mapping` convient) ou de vraies maladresses sans effet
# (`date_action` calculée deux fois, variable de boucle réutilisée sous deux types).
# Ce périmètre n'est pas cosmétique : c'est son absence qui avait laissé passer un `None + float`
# dans `soil_balance.py`, lequel arrêtait le bilan sol en silence (corrigé en 0.21.2).
# RESTENT HORS PÉRIMÈTRE, par coût décroissant à traiter :
# PLUS AUCUN module hors périmètre. Toute régression de typage fait désormais rougir la CI,
# sur les 29 800 lignes. Le nettoyage n'a changé AUCUN comportement : prouvé par comparaison
# d'empreinte sur 8 640 scénarios de décision, types compris.
# À ajouter un par un au fil de leur nettoyage, jamais en bloc.
