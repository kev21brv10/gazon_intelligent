[mypy]
python_version = 3.13
warn_unused_configs = True
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
# Périmètre : les modules qui passent DÉJÀ sans erreur, mesurés un par un puis ensemble.
# Les ajouter ne coûte donc aucune correction et fige leur typage contre les régressions.
# Les 16 restants (coordinator, sensor, guidance, memory, decision, decision_watering,
# gazon_brain, intervention_recommendation, assistant, scores, shared_state, soil_balance,
# watering_policy, weather_sources, number, __init__) demandent du travail réel : à ajouter
# un par un au fil de leur nettoyage, jamais en bloc.
